name: Build & Publish Oxide Windows Installer (.exe)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "index.html"
      - "*.md"
      - "LICENSE"
      - ".nojekyll"
      - "*.ps1"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-C codegen-units=16"

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target & incremental build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-all-crates: true
          save-if: true

      - name: Install frontend dependencies
        run: npm install --prefer-offline --no-audit

      - name: Stamp Release Version & Force Frontend Asset Re-embed
        shell: pwsh
        run: |
          $ver = "0.1.${{ github.run_number }}"
          Write-Host "Stamping release version: $ver"
          (Get-Content "package.json" -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" | Set-Content "package.json" -Encoding UTF8
          (Get-Content "src-tauri/tauri.conf.json" -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$ver`"" | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          (Get-Content "src-tauri/Cargo.toml" -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ver`"" | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8
          # Remove cached oxide-agent binary so Cargo always embeds the newly built ../dist frontend
          Remove-Item "src-tauri/target/release/oxide-agent.exe" -ErrorAction SilentlyContinue
          Remove-Item "src-tauri/target/release/deps/oxide_agent*" -ErrorAction SilentlyContinue

      - name: Build Tauri Desktop Executable & Fast NSIS Installer
        run: npm run desktop:build

      - name: Sign Binaries & Package Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "src-tauri/target/release/oxide-agent.exe" "release-assets/Oxide-Portable.exe" -Force
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "release-assets/Oxide-Setup.exe" -Force
            Copy-Item $nsis.FullName "release-assets/$($nsis.Name)" -Force
          }

          # Apply Authenticode Publisher Signature (Hanzkii Oxide Studio) to binaries
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Hanzkii Oxide Studio" -CertStoreLocation "Cert:\CurrentUser\My"
          Get-ChildItem "release-assets/*.exe" | ForEach-Object {
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert | Out-Null
          }

          Compress-Archive -Path "release-assets/Oxide-Portable.exe" -DestinationPath "release-assets/Oxide-Windows-x64.zip" -Force
          Get-ChildItem "release-assets"

      - name: Publish Fresh Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: "Oxide v0.1.${{ github.run_number }} — Standalone Windows Installer & Portable .exe"
          body: |
            ## Oxide Studio v0.1.${{ github.run_number }} — Windows Release
            - **`Oxide-Setup.exe`**: Fast NSIS Windows installer (includes Antigravity UI, Multi-Project Sidebar, Saved Conversations, and 1-Click AI Model Hub).
            - **`Oxide-Portable.exe`**: Standalone single-file executable.
            - **`Oxide-Windows-x64.zip`**: Portable ZIP archive.
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
