name: Build & Publish Oxide Windows Installer (.exe)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "index.html"
      - "*.md"
      - "LICENSE"
      - ".nojekyll"
      - "*.ps1"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-C codegen-units=16"

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target & incremental build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-all-crates: true
          save-if: true

      - name: Install frontend dependencies
        run: npm install --prefer-offline --no-audit

      - name: Build Tauri Desktop Executable & Fast NSIS Installer
        run: npm run desktop:build

      - name: Sign Binaries & Package SmartScreen-Free Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "src-tauri/target/release/oxide-agent.exe" "release-assets/Oxide-Portable.exe" -Force
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "release-assets/" -Force

          # Apply Authenticode Publisher Signature (Hanzkii Oxide Studio) to binaries
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Hanzkii Oxide Studio" -CertStoreLocation "Cert:\CurrentUser\My"
          Get-ChildItem "release-assets/*.exe" | ForEach-Object {
            Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert | Out-Null
          }

          # Create SmartScreen-bypassing Launcher inside ZIP archive
          @"
          @echo off
          cd /d "%~dp0"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Unblock-File -Path '.\Oxide-Portable.exe' -ErrorAction SilentlyContinue"
          start "" "Oxide-Portable.exe"
          "@ | Set-Content -Path "release-assets/Launch-Oxide.bat" -Encoding ASCII

          Compress-Archive -Path "release-assets/Oxide-Portable.exe", "release-assets/Launch-Oxide.bat" -DestinationPath "release-assets/Oxide-Windows-x64.zip" -Force
          Remove-Item "release-assets/Launch-Oxide.bat" -Force
          Get-ChildItem "release-assets"

      - name: Publish Fast Release Artifacts to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "Oxide v0.1.0 — Standalone Windows Executable & Installer"
          body: |
            ## Oxide Studio — Standalone Windows Release
            - **`Oxide_0.1.0_x64-setup.exe`**: Fast NSIS Windows installer.
            - **`Oxide-Portable.exe`**: Standalone single-file executable.
            - **`Oxide-Windows-x64.zip`**: Portable ZIP archive.
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
